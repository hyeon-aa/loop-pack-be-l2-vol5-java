server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - classpath:jpa.yml
      - classpath:redis.yml
      - classpath:kafka.yml
      - classpath:logging.yml
      - classpath:monitoring.yml

demo-kafka:
  enabled: false # 실제 소비 설정을 선택하기 전에는 demo도 자동 구독하지 않는다.
  test:
    topic-name: demo.internal.topic-v1

commerce:
  order-events:
    topic: order-events
    consumer:
      enabled: false # 기본은 끈다. local profile에서만 켠다(아래).
      # 메시지 문제가 아닌 실패(DB 등)의 재시도. 이 시간 안에 풀리면 스스로 이어 가고, 넘기면 listener를 멈춘다.
      retry:
        initial-interval: 1s
        multiplier: 2
        max-interval: 30s
        max-elapsed-time: 5m # 간격의 합. DB failover(보통 수십 초~2분)보다 넉넉하게

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring.config.activate.on-profile: local

# 로컬은 앱 1대이므로 concurrency 3이 group 전체 consumer 3개(ADR 0044)다.
commerce.order-events.consumer:
  enabled: true
  concurrency: 3

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
