server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - classpath:jpa.yml
      - classpath:redis.yml
      - classpath:kafka.yml
      - classpath:logging.yml
      - classpath:monitoring.yml

demo-kafka:
  enabled: false # 실제 소비 설정을 선택하기 전에는 demo도 자동 구독하지 않는다.
  test:
    topic-name: demo.internal.topic-v1

commerce:
  order-events:
    topic: order-events
    consumer:
      enabled: false # 기본은 끈다.

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
